name: Hz Sports daily injury reports
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hz-injury-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public injury sources
        run: python hz-sports-odds/refresh_injuries.py
      - name: Save verified source report
        run: |
          git config user.name "Hz Sports data refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hz-sports/injury-cache.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh daily public injury reports"
          git pull --rebase origin main
          git push origin HEAD:main
