function toolPage(){return '<div class="panel"><h2>離線可操作計算機</h2><div class="actions">'+calcNames.map((x,i)=>button(x,'setTool('+i+')',tool===i)).join('')+'</div><div id="calcForm"></div></div>'}
function setTool(i){tool=i;openPage('tools');drawForm()}
function drawForm(){let x=document.getElementById('calcForm');if(!x)return;x.innerHTML='<h3>'+calcNames[tool]+'</h3><div class="inputs">'+fields[tool].map((f,i)=>'<label>'+f[0]+'<input id="calc'+i+'" type="number" step="any" value="'+f[1]+'"></label>').join('')+'</div>'+button('開始計算','compute()',true)+'<div id="calcResult" class="result">請輸入參數並計算。</div><p class="muted small">數學計算供參考；不構成投資或投注建議。過關組合以等賠率近似示範。</p>'}
const money=x=>Number.isFinite(x)?x.toFixed(2):'—',percent=x=>money(x*100)+'%';
function compute(){let v=fields[tool].map((f,i)=>Number(document.getElementById('calc'+i).value));let [a,b,c]=v,r='';if(v.some(x=>!Number.isFinite(x)))return output('請輸入有效數字');const odds=x=>x>1;
switch(tool){
case 0:if(a<0||a>100||!odds(b))break;r='全凱利投入比例：'+percent(Math.max(0,(a/100*b-1)/(b-1)))+'；半凱利：'+percent(Math.max(0,(a/100*b-1)/(b-1))/2);break;
case 1:if(!odds(a)||!odds(b)||c<=0)break;r='兩關合計賠率：'+money(a*b)+'；全部命中總返還：'+money(a*b*c)+'；淨利：'+money((a*b-1)*c);break;
case 2:if(a<2||a>15||a%1||b<=0||!odds(c))break;let bets=Math.pow(2,a)-a-1,returnAll=0;for(let k=2;k<=a;k++){let comb=1;for(let j=1;j<=k;j++)comb=comb*(a-j+1)/j;returnAll+=comb*b*Math.pow(c,k)}r='全部 2 至 '+a+' 關組合數：'+bets+'；總投入：'+money(b*bets)+'；全部命中總返還（假設均賠率）：'+money(returnAll);break;
case 3:if(a<0||a>100||!odds(b))break;r='EV = '+percent(a/100*b-1);break;
case 4:if(!odds(a))break;r='隱含機率：'+percent(1/a);break;
case 5:case 6:if(!odds(a)||!odds(b))break;let over=1/a+1/b;r=tool===5?'市場抽水率（超額機率）：'+percent(over-1):'兩向市場超額機率：'+percent(over-1)+'；理論返還率：'+percent(1/over);break;
case 7:if(!odds(a)||!odds(b))break;r='去除抽水後的公平賠率 A：'+money((1/a+1/b)/(1/a))+'；B：'+money((1/a+1/b)/(1/b));break;
case 8:if(!odds(a))break;r='美式賠率：'+(a>=2?'+'+money((a-1)*100):money(-100/(a-1)))+'；分數賠率：'+money(a-1)+':1；隱含機率：'+percent(1/a);break;
case 9:if(!odds(a)||!odds(b)||c<=0)break;let q=1/a+1/b;r='機率合計：'+percent(q)+'；'+(q<1?'存在理論套利空間':'無理論套利空間')+'；A 分配：'+money(c/a/q)+'；B 分配：'+money(c/b/q)+'；固定總返還：'+money(c/q);break;
case 10:if(a<=0||!odds(b)||!odds(c))break;let h=a*(b-1)/(c+b-1);r='免本金返還型免費投注：對沖本金約 '+money(h)+'；理論鎖定淨額約 '+money(h*(c-1))+'（未納入手續費與盤口限制）';break;
case 11:r='主隊預估淨勝分：'+money(a-b)+'；扣除讓分後：'+money(a-b+c)+'（正數為主隊覆蓋，負數為客隊覆蓋，零為走水）';break;
case 12:if(a<0||b<0||b%1||b>100)break;let p=Math.exp(-a),k=1;for(let i=1;i<=b;i++){p*=a/i}r='泊松分佈 P(X='+b+')：'+percent(p);break;
}
output(r||'輸入值超出合理範圍，請重新確認。')}
function output(s){document.getElementById('calcResult').textContent=s}
openPage('home');
</script></body></html>
