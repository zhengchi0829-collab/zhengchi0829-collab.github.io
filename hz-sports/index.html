<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hz SPORTS｜智慧體育 AI 分析</title><meta name="description" content="Hz SPORTS 體育 AI 賽事分析、賠率比較與工具中心"><style>
:root{color-scheme:dark;--bg:#080d19;--panel:#111b2d;--line:#233652;--accent:#38c8fa;--text:#eaf2ff;--muted:#91a5c0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#12365c 0,transparent 38%),var(--bg);font:15px system-ui,"Noto Sans TC",sans-serif;color:var(--text)}header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#080d19ed;backdrop-filter:blur(12px);z-index:5}header .bar{max-width:1350px;margin:auto;padding:17px 25px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900;letter-spacing:1px}.brand span{color:var(--accent)}.tag{border:1px solid #245d7a;border-radius:30px;padding:6px 12px;color:#8bd9ff;font-size:12px}.layout{max-width:1350px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 70px)}aside{padding:24px 14px;border-right:1px solid var(--line)}aside button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#9eb3cf;padding:13px 15px;border-radius:10px;font-size:15px;margin:3px 0;cursor:pointer}aside button.active,aside button:hover{background:#17344e;color:#83dcff}main{padding:35px;min-width:0}.hero{background:linear-gradient(110deg,#123857,#112439 70%);border:1px solid #296082;padding:30px;border-radius:20px;margin-bottom:25px}.hero h1{font-size:clamp(27px,4vw,41px);margin:0 0 10px}.hero p,.sub{color:var(--muted)}h2{margin:0 0 16px;font-size:22px}h3{margin:0 0 12px;font-size:17px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.stat b{display:block;font-size:24px;margin-top:10px;color:#e6f7ff}.stat small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}.small{font-size:12px;color:var(--muted)}.pill{display:inline-block;padding:5px 10px;background:#193b52;color:#90e1ff;border-radius:8px;font-size:12px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px}.tabs button,button.action{background:#18334e;border:1px solid #345875;color:#e5f5ff;padding:9px 14px;border-radius:9px;cursor:pointer}.tabs button.on,button.action{background:#1589b4;border-color:#1589b4;color:white}.match{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:17px 0;border-bottom:1px solid #25354b}.match:last-child{border-bottom:0}.match strong{display:block;margin:5px 0}.match .right{text-align:right}input,select{background:#0d1727;border:1px solid #35506f;color:white;padding:12px;border-radius:9px;width:100%}.forms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.result{border-left:3px solid #32d3a1;background:#12312c;padding:14px 16px;border-radius:9px;margin-top:16px}.note{font-size:12px;color:#ffda96}.hide{display:none!important}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:13px;text-align:left;border-bottom:1px solid #273a53}.table th{color:#91a5c0;font-size:12px;font-weight:600}footer{color:#7088a6;padding:26px 0;font-size:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:5px;border-right:0;border-bottom:1px solid var(--line);padding:10px}aside button{width:auto;white-space:nowrap;margin:0}main{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.grid,.forms{grid-template-columns:1fr}.hero{padding:22px}.stat{padding:14px}.stats{gap:8px}}
</style></head><body><header><div class="bar"><div class="brand">Hz <span>SPORTS</span></div><span class="tag">● DEMO 展示模式</span></div></header><div class="layout"><aside id="nav"></aside><main><section class="hero"><span class="pill">智慧運動數據平台</span><h1 id="title">AI 體育分析控制台</h1><p id="subtitle">掌握賽程、模型指標、賠率與數據研究工具。支援手機與電腦。</p><div class="note">目前尚未連接即時賽事／賠率 API。頁面中的賽事和數值為示意，不能作為實際投注依據。</div></section><div id="content"></div><footer>© 2026 Hz SPORTS · 獨立展示網站 · 不提供保證獲利之承諾</footer></main></div><script>
const menus=[['dashboard','⌂ 總覽'],['events','◉ 賽事中心'],['ai','✦ AI 分析'],['odds','▥ 賠率比較'],['history','◷ 歷史戰績'],['performance','▤ 模型績效'],['tools','▣ 計算工具'],['favorites','☆ 我的關注']];
const demo=[{sport:'籃球',league:'NBA',home:'塞爾提克',away:'尼克',time:'示範賽事 A',odds:'1.88',line:'-4.5'},{sport:'足球',league:'英超',home:'利物浦',away:'阿森納',time:'示範賽事 B',odds:'1.95',line:'2.5'},{sport:'棒球',league:'MLB',home:'道奇',away:'洋基',time:'示範賽事 C',odds:'1.91',line:'-1.5'}];
let current='dashboard',filter='全部',saved=JSON.parse(localStorage.getItem('hzFavorites')||'[]');
const nav=document.getElementById('nav'),content=document.getElementById('content');
nav.innerHTML=menus.map(x=>'<button data-page="'+x[0]+'">'+x[1]+'</button>').join('');nav.onclick=e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)};
const card=(x,i)=>'<div class="match"><div><span class="pill">'+x.sport+' · '+x.league+'</span><strong>'+x.home+'　VS　'+x.away+'</strong><span class="small">'+x.time+' · 示範資料</span></div><div class="right"><button class="action" onclick="fav('+i+')">'+(saved.includes(i)?'★':'☆')+' 關注</button></div></div>';
const cards=a=>a.length?a.map(x=>card(x,demo.indexOf(x))).join(''):'<p class="sub">目前沒有符合條件的示範賽事。</p>';
function fav(i){saved=saved.includes(i)?saved.filter(v=>v!==i):[...saved,i];localStorage.setItem('hzFavorites',JSON.stringify(saved));go(current)}
function go(page){current=page;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const info={
dashboard:['AI 體育分析控制台','即時資訊串接前的展示儀表板。'],
events:['全球賽事中心','依球種篩選賽程與對戰資訊。'],
ai:['AI 賽事預測','獨贏、讓分、大小分的分析卡片展示。'],
odds:['賠率比較中心','比較不同盤口類型與資料來源。'],
history:['歷史賽事與戰績','近五場與完賽紀錄的展示版面。'],
performance:['AI 模型績效','追蹤模型預測與回測品質。'],
tools:['體育分析計算工具','使用本機計算，不依賴付費 API。'],
favorites:['我的關注賽事','你關注的示範賽事儲存在目前瀏覽器。']};document.getElementById('title').textContent=info[page][0];document.getElementById('subtitle').textContent=info[page][1];
if(page==='dashboard')content.innerHTML='<div class="stats"><div class="stat"><small>展示聯賽</small><b>3</b></div><div class="stat"><small>支援球種</small><b>3</b></div><div class="stat"><small>分析玩法</small><b>3</b></div><div class="stat"><small>API 狀態</small><b>未串接</b></div></div><div class="grid"><div class="panel"><h3>焦點賽事示範</h3>'+cards(demo)+'</div><div class="panel"><h3>功能速覽</h3><p>✓ 賽事分類與追蹤</p><p>✓ AI 預測卡片介面</p><p>✓ 賠率比較表格</p><p>✓ EV、凱利、賠率換算等計算功能</p><p class="note">真實數據整合需另行設定授權 API。</p></div></div>';
if(page==='events'){content.innerHTML='<div class="panel"><div class="tabs">'+['全部','足球','籃球','棒球'].map(v=>'<button class="'+(filter===v?'on':'')+'" onclick="filter=''+v+'';go(\'events\')">'+v+'</button>').join('')+'</div>'+cards(demo.filter(x=>filter==='全部'||x.sport===filter))+'</div>'}
if(page==='ai')content.innerHTML='<div class="grid">'+demo.map(x=>'<div class="panel"><span class="pill">'+x.sport+' · '+x.league+'</span><h3 style="margin-top:16px">'+x.home+' vs '+x.away+'</h3><p class="sub">獨贏／讓分／大小分模型分析</p><table class="table"><tr><td>模型勝率</td><td>尚無正式預測</td></tr><tr><td>實際盤口</td><td>尚未串接</td></tr><tr><td>近五場戰績</td><td>待接入資料源</td></tr></table><p class="note">未產生虛構 AI 推薦</p></div>').join('')+'</div>';
if(page==='odds')content.innerHTML='<div class="panel"><h3>盤口資料比較</h3><table class="table"><thead><tr><th>賽事</th><th>台灣運彩</th><th>國際盤口</th><th>最後更新</th></tr></thead><tbody>'+demo.map(x=>'<tr><td>'+x.home+' / '+x.away+'</td><td>尚未串接</td><td>尚未串接</td><td>—</td></tr>').join('')+'</tbody></table><p class="note">不以演算法猜測賠率充當官方盤口。</p></div>';
if(page==='history')content.innerHTML='<div class="panel"><h3>歷史紀錄</h3><p class="sub">尚未連接完賽資料與歷史戰績 API。串接後可查看比數、近五場勝率和已完賽分析結算。</p></div>';
if(page==='performance')content.innerHTML='<div class="stats"><div class="stat"><small>已驗證場次</small><b>0</b></div><div class="stat"><small>預測命中率</small><b>—</b></div><div class="stat"><small>模型 ROI</small><b>—</b></div><div class="stat"><small>樣本完整度</small><b>—</b></div></div><div class="panel"><p class="sub">接入真實歷史預測與賽果後，才會計算可信的命中率、ROI 與資金曲線。</p></div>';
if(page==='favorites')content.innerHTML='<div class="panel"><h3>已關注的示範賽事</h3>'+cards(demo.filter((_,i)=>saved.includes(i)))+'</div>';
if(page==='tools')tools()}
function tools(){content.innerHTML='<div class="panel"><div class="tabs" id="tooltabs"></div><div id="calc"></div></div><div class="panel" style="margin-top:16px"><h3>其他計算工具</h3><p class="sub">串關 · 過關組合 · 抽水 · 莊家利潤 · 公平賠率 · 紅利轉換 · 讓分換算 · 泊松分佈。其他工具的計算器會在後續版本加入。</p></div>';const arr=['期望值 EV','隱含勝率','凱利公式','賠率轉換','套利計算'];document.getElementById('tooltabs').innerHTML=arr.map((v,i)=>'<button onclick="renderTool('+i+')" id="tool'+i+'">'+v+'</button>').join('');renderTool(0)}
function renderTool(i){document.querySelectorAll('#tooltabs button').forEach((b,j)=>b.classList.toggle('on',i===j));const inputs=[
[['預測勝率 (%)','60'],['歐式賠率','1.8']],
[['歐式賠率','1.9']],
[['預測勝率 (%)','55'],['歐式賠率','2.0']],
[['歐式賠率','1.9']],
[['結果 A 賠率','2.1'],['結果 B 賠率','2.1'],['總本金','1000']]
][i];document.getElementById('calc').innerHTML='<div class="forms">'+inputs.map((p,j)=>'<label>'+p[0]+'<input type="number" step="any" id="v'+j+'" value="'+p[1]+'"></label>').join('')+'</div><p><button class="action" onclick="calculate('+i+')">計算結果</button></p><div id="answer" class="result">輸入數值後點擊計算。</div>'}
function calculate(i){let v=[0,1,2].map(j=>Number(document.getElementById('v'+j)?.value));let r='';const pct=n=>(n*100).toFixed(2)+'%';if(i===0){if(v[0]<0||v[0]>100||v[1]<=1)return err();r='EV：'+pct(v[0]/100*v[1]-1)}if(i===1){if(v[0]<=1)return err();r='隱含勝率：'+pct(1/v[0])}if(i===2){if(v[0]<0||v[0]>100||v[1]<=1)return err();r='全凱利比例：'+pct(Math.max(0,((v[0]/100*v[1]-1)/(v[1]-1))))}if(i===3){if(v[0]<=1)return err();r='美式賠率：'+(v[0]>=2?'+'+((v[0]-1)*100).toFixed(0):(-100/(v[0]-1)).toFixed(0))+'；分數賠率：'+(v[0]-1).toFixed(3)+':1'}if(i===4){if(v[0]<=1||v[1]<=1||v[2]<=0)return err();let a=1/v[0]+1/v[1];r='隱含機率總和：'+pct(a)+'；'+(a<1?'理論套利空間 '+pct(1-a):'沒有理論套利空間')+'；分配 A：'+(v[2]/v[0]/a).toFixed(2)+'，B：'+(v[2]/v[1]/a).toFixed(2)}document.getElementById('answer').textContent=r+'（僅數學計算）'}
function err(){document.getElementById('answer').textContent='請輸入合理的勝率、賠率與金額。'}
go('dashboard');
</script></body></html>
